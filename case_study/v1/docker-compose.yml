version: '3.9'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  harvester:
    build:
      context: .
      dockerfile: Dockerfile.harvester
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  reconciler:
    build:
      context: .
      dockerfile: Dockerfile.reconciler
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  redis_data: